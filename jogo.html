          </div>

          <svg class="placar__x so-2-jogadores" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 4 L20 20 M20 4 L4 20" stroke="#e60000" stroke-width="5" stroke-linecap="round" fill="none"/>

          </div>
        </div>

        <p class="placar__tempo">Tempo: <span id="tempo">20</span> Segundos</p>
      </div>
    </header>

    <!-- Menu de pausa: abre e fecha sozinho (popover nativo), sem JS.

         menu.addEventListener("toggle", (e) => e.newState === "open" ? pausar() : continuar()) -->
